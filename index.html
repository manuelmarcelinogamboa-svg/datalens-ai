<script>
async function ask(){
  const q=document.getElementById('q').value,a=document.getElementById('a');
  if(!q){a.innerText='Type a question first';return}
  a.innerText='AI thinking...';
 try{
    const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer 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'
      },
      body:JSON.stringify({
        model:'llama-3.1-8b-instant',
        messages:[
          {role:'system',content:'You are a Shopify data analyst. Give 1 direct action in 2 sentences max. Be specific with numbers.'},
          {role:'user',content:q}
        ],
        temperature:0.2,
        max_tokens:120
      })
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error?.message||'Groq API error');
